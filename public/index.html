<body>
  <!-- App root -->
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen hidden">
      <div class="login-bg"></div>
      <div class="login-card">
        <div class="login-logo">
          <svg class="logo-icon" viewBox="0 0 60 60"><defs><linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7c3aed"/><stop offset="100%" style="stop-color:#f59e0b"/></linearGradient></defs><path fill="url(#lg1)" d="M30 5L5 18v24l25 13 25-13V18L30 5zm0 8l18 9.5v19L30 51 12 41.5v-19L30 13z"/><path fill="rgba(255,255,255,0.8)" d="M30 20l-8 4v8l8 4 8-4v-8l-8-4z"/></svg>
          <div>
            <h1 class="login-title">Nova Chrono</h1>
            <p class="login-sub">Magic Kingdom Portal</p>
          </div>
        </div>
        <p class="login-desc">Enter the email you linked with <code>/secure</code> in the Telegram bot to access your Magic Knight dashboard.</p>
        <div class="login-form">
          <div class="input-group">
            <svg class="input-icon"><use href="#icon-user"/></svg>
            <input id="login-email" type="email" placeholder="your@gmail.com" autocomplete="email" />
          </div>
          <button id="login-btn" class="btn btn-primary btn-lg">
            <svg class="btn-icon"><use href="#icon-bolt"/></svg>
            Enter the Kingdom
          </button>
          <p id="login-error" class="login-error hidden"></p>
        </div>
        <p class="login-hint">Don't have access? Open <strong>Telegram</strong>, message the bot, and send <code>/secure your@email.com</code></p>
      </div>
    </div>

    <!-- Main App Shell (hidden until logged in) -->
    <div id="main-app" class="main-app hidden">
      <!-- Top Bar -->
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="topbar-menu" id="topbar-menu-btn" title="Menu">
            <svg><use href="#icon-settings"/></svg>
          </button>
          <span class="topbar-title" id="topbar-title">Home</span>
        </div>
        <div class="topbar-right">
          <div class="topbar-balance" id="topbar-balance">
            <svg class="icon-sm"><use href="#icon-coin"/></svg>
            <span id="topbar-yul">--</span>
          </div>
          <button class="topbar-btn" id="topbar-bell" title="Cooldowns">
            <svg><use href="#icon-bell"/></svg>
            <span class="badge" id="cd-badge" style="display:none"></span>
          </button>
        </div>
      </header>

      <!-- Settings Drawer -->
      <div class="drawer-overlay" id="drawer-overlay"></div>
      <aside class="settings-drawer" id="settings-drawer">
        <div class="drawer-header">
          <span>Settings</span>
          <button id="drawer-close"><svg><use href="#icon-close"/></svg></button>
        </div>
        <div class="drawer-user" id="drawer-user-info"></div>
        <nav class="drawer-nav">
          <button class="drawer-item" id="btn-edit-email">
            <svg><use href="#icon-user"/></svg> Link Email
          </button>
          <button class="drawer-item" id="btn-logout">
            <svg><use href="#icon-logout"/></svg> Log Out
          </button>
        </nav>
      </aside>

      <!-- Page Content -->
      <main class="page-content" id="page-content">
        <!-- Sections injected by JS -->
      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" data-tab="home" id="nav-home">
          <svg><use href="#icon-home"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-tab="market" id="nav-market">
          <svg><use href="#icon-shop"/></svg>
          <span>Market</span>
        </button>
        <button class="nav-item" data-tab="cards" id="nav-cards">
          <svg><use href="#icon-cards"/></svg>
          <span>Cards</span>
        </button>
        <button class="nav-item" data-tab="games" id="nav-games">
          <svg><use href="#icon-games"/></svg>
          <span>Games</span>
        </button>
        <button class="nav-item" data-tab="community" id="nav-community">
          <svg><use href="#icon-community"/></svg>
          <span>Community</span>
        </button>
        <button class="nav-item admin-tab hidden" data-tab="admin" id="nav-admin">
          <svg><use href="#icon-admin"/></svg>
          <span>Admin</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Global Toast -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Global Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close"><svg><use href="#icon-close"/></svg></button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Cooldown Panel -->
  <div id="cd-panel" class="cd-panel hidden">
    <div class="cd-panel-header">
      <span>⏱ Cooldowns</span>
      <button id="cd-panel-close"><svg><use href="#icon-close"/></svg></button>
    </div>
    <div id="cd-panel-body"></div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
